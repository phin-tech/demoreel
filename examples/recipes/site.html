<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supper — recipes for tonight</title>
<!-- A made-up recipe site for demoreel's recipes example: one file, no server, every action a click. -->
<style>
  :root {
    --paper: #fbf6ee; --card: #fffdf9; --ink: #2b2420; --muted: #8a7d72; --line: #ece2d4;
    --tomato: #d9532b; --tomato-soft: #fbe3d8; --herb: #4f7a4a; --herb-soft: #e3eedd;
    --serif: "Iowan Old Style", "Palatino", Georgia, serif; --sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  header { display: flex; align-items: center; gap: 28px; padding: 22px 48px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 5; }
  .logo { font-family: var(--serif); font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  .logo span { color: var(--tomato); }
  .search { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .search input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 17px; background: none; color: var(--ink); }
  .bag { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; }
  .bag b { min-width: 24px; height: 24px; border-radius: 12px; background: var(--tomato); color: #fff; font-size: 13px; display: grid; place-items: center; transition: transform .25s; }
  .bag b.bump { transform: scale(1.35); }
  main { padding: 36px 48px 60px; }
  h1 { font-family: var(--serif); font-size: 44px; letter-spacing: -1px; line-height: 1.1; }
  .sub { color: var(--muted); margin-top: 8px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 30px; }
  .tile { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform .2s, box-shadow .2s; }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(80,50,20,.12); }
  .tile .art { height: 150px; display: grid; place-items: center; font-size: 72px; }
  .tile .meta { padding: 14px 18px 18px; }
  .tile h3 { font-family: var(--serif); font-size: 21px; }
  .tile p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .tile.hidden { display: none; }
  .empty { display: none; color: var(--muted); margin-top: 30px; font-size: 18px; }
  /* A recipe */
  .recipe { display: none; grid-template-columns: 1fr 1.25fr; gap: 40px; }
  .back { color: var(--muted); font-weight: 600; margin-bottom: 18px; }
  .hero { height: 240px; border-radius: 20px; display: grid; place-items: center; font-size: 120px; }
  .facts { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .fact { padding: 8px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px 28px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .serves { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .step { width: 38px; height: 38px; border-radius: 19px; background: var(--tomato-soft); color: var(--tomato); font-size: 22px; font-weight: 700; }
  .serves output { min-width: 28px; text-align: center; font-size: 22px; }
  ul.ing { list-style: none; margin-top: 16px; }
  ul.ing li { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 17px; }
  ul.ing .q { min-width: 92px; font-weight: 700; color: var(--tomato); transition: color .3s; }
  ul.ing .q.flash { color: var(--herb); }
  .add { margin-top: 18px; width: 100%; padding: 14px; border-radius: 14px; background: var(--herb); color: #fff; font-weight: 700; font-size: 16px; }
  .add.done { background: var(--herb-soft); color: var(--herb); }
  .cook { margin-top: 16px; width: 100%; padding: 14px; border-radius: 14px; background: var(--tomato); color: #fff; font-weight: 700; font-size: 16px; }
  /* Cooking mode */
  .mode { display: none; position: fixed; inset: 0; background: #241d19; color: #fbf6ee; z-index: 10; padding: 48px 72px; flex-direction: column; }
  .mode .top { display: flex; justify-content: space-between; color: #b9aa9b; font-weight: 600; }
  .mode .now { font-family: var(--serif); font-size: 46px; line-height: 1.2; margin-top: 70px; max-width: 900px; }
  .timer { margin-top: 44px; display: flex; align-items: center; gap: 22px; }
  .timer .clock { font-variant-numeric: tabular-nums; font-size: 64px; font-weight: 700; }
  .timer button { padding: 14px 26px; border-radius: 999px; background: var(--tomato); color: #fff; font-weight: 700; font-size: 18px; }
  .timer button.running { background: #3a302a; color: #fbf6ee; }
  .mode .nav { margin-top: auto; display: flex; justify-content: space-between; }
  .mode .nav button { padding: 14px 26px; border-radius: 999px; border: 1px solid #4a3f37; color: #fbf6ee; font-weight: 600; font-size: 17px; }
  .dots { display: flex; gap: 8px; align-items: center; }
  .dots i { width: 10px; height: 10px; border-radius: 5px; background: #4a3f37; }
  .dots i.on { background: var(--tomato); }
  /* Shopping list */
  .list { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: var(--card); border-left: 1px solid var(--line); box-shadow: -20px 0 40px rgba(80,50,20,.12);
    transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); z-index: 8; padding: 28px; }
  .list.open { transform: none; }
  .list h2 { font-family: var(--serif); font-size: 28px; }
  .list ul { list-style: none; margin-top: 18px; }
  .list li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .list li input { width: 20px; height: 20px; accent-color: var(--herb); }
  .list li.got span { text-decoration: line-through; color: var(--muted); }
  .list .close { position: absolute; top: 26px; right: 24px; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="logo">Supper<span>.</span></div>
  <label class="search">🔍 <input id="q" placeholder="Search recipes" autocomplete="off"></label>
  <button class="bag" id="bag" aria-label="Shopping list">🧺 List <b id="count">0</b></button>
</header>

<main>
  <section id="home">
    <h1>What's for supper?</h1>
    <p class="sub">Six recipes for a weeknight. None of them take an hour.</p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">Nothing by that name. Try “lemon”.</p>
  </section>

  <section class="recipe" id="recipe">
    <div>
      <button class="back" id="back">← All recipes</button>
      <div class="hero" id="hero"></div>
      <h1 id="title" style="margin-top:22px"></h1>
      <p class="sub" id="blurb"></p>
      <div class="facts" id="facts"></div>
    </div>
    <div>
      <div class="panel">
        <div class="row">
          <h2 style="font-family:var(--serif);font-size:26px">Ingredients</h2>
          <div class="serves">Serves
            <button class="step" id="less" aria-label="Fewer servings">−</button>
            <output id="serves">2</output>
            <button class="step" id="more" aria-label="More servings">+</button>
          </div>
        </div>
        <ul class="ing" id="ing"></ul>
        <button class="add" id="add">Add to shopping list</button>
        <button class="cook" id="cook">Start cooking</button>
      </div>
    </div>
  </section>
</main>

<section class="mode" id="mode">
  <div class="top"><span id="modeTitle"></span><button id="exit" style="color:#b9aa9b;font-weight:600">Done ✕</button></div>
  <div class="now" id="now"></div>
  <div class="timer" id="timerRow"><span class="clock" id="clock">0:00</span><button id="timer">Start timer</button></div>
  <div class="nav"><button id="prev">← Back</button><div class="dots" id="dots"></div><button id="next">Next step →</button></div>
</section>

<aside class="list" id="list">
  <button class="close" id="closeList">Close</button>
  <h2>Shopping list</h2>
  <ul id="items"></ul>
</aside>

<script>
const RECIPES = [
  { id: "pancakes", name: "Lemon ricotta pancakes", art: "🥞", bg: "#fdf0c8", mins: 25, blurb: "Light, a little tart, and gone before the last one is off the pan.",
    serves: 2, ing: [[200, "g", "ricotta"], [2, "", "eggs"], [1, "", "lemon, zested"], [90, "g", "flour"], [1, "tbsp", "sugar"], [15, "g", "butter, for the pan"]],
    steps: [["Whisk the ricotta, eggs and lemon zest until smooth.", 0], ["Fold in the flour and sugar. Lumps are fine.", 0], ["Cook in butter, two minutes a side.", 120], ["Stack, and squeeze the lemon over the top.", 0]] },
  { id: "pasta", name: "Lemon garlic spaghetti", art: "🍝", bg: "#f6e6cf", mins: 15, blurb: "", serves: 2, ing: [], steps: [] },
  { id: "curry", name: "Chickpea curry", art: "🍛", bg: "#f8dcc2", mins: 30, blurb: "", serves: 4, ing: [], steps: [] },
  { id: "tacos", name: "Crispy fish tacos", art: "🌮", bg: "#f9e5c9", mins: 25, blurb: "", serves: 2, ing: [], steps: [] },
  { id: "soup", name: "Tomato and bread soup", art: "🍅", bg: "#fbd9cf", mins: 35, blurb: "", serves: 4, ing: [], steps: [] },
  { id: "salad", name: "Lemony lentil salad", art: "🥗", bg: "#e3eedd", mins: 20, blurb: "", serves: 2, ing: [], steps: [] },
];
const $ = (id) => document.getElementById(id);
let current = null, serves = 2, step = 0, ticking = null, list = [];

function tiles() {
  $("grid").innerHTML = RECIPES.map((r) => `<button class="tile" data-id="${r.id}" aria-label="${r.name}"><div class="art" style="background:${r.bg}">${r.art}</div>
    <div class="meta"><h3>${r.name}</h3><p>${r.mins} min · serves ${r.serves}</p></div></button>`).join("");
  document.querySelectorAll(".tile").forEach((t) => (t.onclick = () => open(t.dataset.id)));
}
function filter() {
  const q = $("q").value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".tile").forEach((t) => {
    const hit = !q || t.textContent.toLowerCase().includes(q);
    t.classList.toggle("hidden", !hit);
    shown += hit;
  });
  $("empty").style.display = shown ? "none" : "block";
  if (current) back();
}
const amount = (n) => {
  const v = (n * serves) / current.serves;
  return Number.isInteger(v) ? String(v) : v.toFixed(1).replace(/\.0$/, "");
};
function ingredients(flash) {
  $("serves").textContent = serves;
  $("ing").innerHTML = current.ing.map(([n, u, what]) => `<li><span class="q${flash ? " flash" : ""}">${amount(n)} ${u}</span><span>${what}</span></li>`).join("");
  if (flash) setTimeout(() => document.querySelectorAll(".q.flash").forEach((q) => q.classList.remove("flash")), 350);
}
function open(id) {
  current = RECIPES.find((r) => r.id === id) ?? RECIPES[0];
  serves = current.serves;
  $("home").style.display = "none";
  $("recipe").style.display = "grid";
  $("hero").textContent = current.art;
  $("hero").style.background = current.bg;
  $("title").textContent = current.name;
  $("blurb").textContent = current.blurb;
  $("facts").innerHTML = [`${current.mins} min`, `${current.ing.length} ingredients`, `${current.steps.length} steps`].map((f) => `<span class="fact">${f}</span>`).join("");
  $("add").textContent = "Add to shopping list";
  $("add").classList.remove("done");
  ingredients(false);
}
function back() {
  current = null;
  $("recipe").style.display = "none";
  $("home").style.display = "block";
}
function showStep() {
  clearInterval(ticking);
  ticking = null;
  const [text, secs] = current.steps[step];
  $("now").textContent = text;
  $("timerRow").style.visibility = secs ? "visible" : "hidden";
  $("clock").textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  $("timer").textContent = "Start timer";
  $("timer").classList.remove("running");
  $("dots").innerHTML = current.steps.map((_, i) => `<i class="${i === step ? "on" : ""}"></i>`).join("");
  $("next").textContent = step === current.steps.length - 1 ? "Finish ✓" : "Next step →";
}
function startTimer() {
  if (ticking) return;
  let left = current.steps[step][1];
  $("timer").textContent = "Running…";
  $("timer").classList.add("running");
  ticking = setInterval(() => {
    left = Math.max(0, left - 1);
    $("clock").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    if (!left) { clearInterval(ticking); ticking = null; $("timer").textContent = "Done!"; }
  }, 1000);
}
function renderList() {
  $("count").textContent = list.length;
  $("count").classList.add("bump");
  setTimeout(() => $("count").classList.remove("bump"), 250);
  $("items").innerHTML = list.map((it, i) => `<li${it.got ? ' class="got"' : ""}><input type="checkbox" data-i="${i}"${it.got ? " checked" : ""}><span>${it.text}</span></li>`).join("");
  document.querySelectorAll("#items input").forEach((c) => (c.onchange = () => { list[c.dataset.i].got = c.checked; renderList(); }));
}

$("q").oninput = filter;
$("back").onclick = back;
$("less").onclick = () => { if (serves > 1) { serves--; ingredients(true); } };
$("more").onclick = () => { if (serves < 12) { serves++; ingredients(true); } };
$("add").onclick = () => {
  list.push(...current.ing.map(([n, u, what]) => ({ text: `${amount(n)} ${u} ${what}`.replace(/\s+/g, " ") })));
  $("add").textContent = `Added ${current.ing.length} things ✓`;
  $("add").classList.add("done");
  renderList();
};
$("cook").onclick = () => { step = 0; $("modeTitle").textContent = current.name; $("mode").style.display = "flex"; showStep(); };
$("exit").onclick = () => { clearInterval(ticking); $("mode").style.display = "none"; };
$("next").onclick = () => { if (step < current.steps.length - 1) { step++; showStep(); } else $("exit").onclick(); };
$("prev").onclick = () => { if (step > 0) { step--; showStep(); } };
$("timer").onclick = startTimer;
$("bag").onclick = () => $("list").classList.toggle("open");
$("closeList").onclick = () => $("list").classList.remove("open");
tiles();
// #pancakes opens that recipe, so a scene can start on it.
if (location.hash) open(location.hash.slice(1));
</script>
</body>
</html>
